name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: ./tool/dev.sh get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed apps packages

      - name: Analyze
        run: ./tool/dev.sh analyze

      - name: Test
        run: ./tool/dev.sh test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/launchpad_app
      - run: flutter build web --release
        working-directory: apps/launchpad_app
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/launchpad_app/build/web
          retention-days: 7

  build-native:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            setup: |
              flutter create --org com.launchpadcareer --platforms=android .
            build: flutter build apk --debug
          - os: windows-latest
            target: windows
            setup: |
              flutter create --org com.launchpadcareer --platforms=windows .
            build: flutter build windows --debug
          - os: macos-latest
            target: macos
            setup: |
              flutter create --org com.launchpadcareer --platforms=macos .
            build: flutter build macos --debug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Native folders are generated rather than committed, so they are created
      # here. These are unsigned verification builds only - signed release builds
      # live in a separate, credentialed workflow that does not exist yet.
      - name: Generate platform folder
        run: ${{ matrix.setup }}
        working-directory: apps/launchpad_app
        shell: bash

      - run: flutter pub get
        working-directory: apps/launchpad_app
        shell: bash

      - name: Build
        run: ${{ matrix.build }}
        working-directory: apps/launchpad_app
        shell: bash
