version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/apps/launchpad_app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "pub"
    directory: "/packages/launchpad_core"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]

  - package-ecosystem: "pub"
    directory: "/packages/launchpad_domain"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]

  - package-ecosystem: "pub"
    directory: "/packages/launchpad_data"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]

  - package-ecosystem: "pub"
    directory: "/packages/launchpad_ui"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
