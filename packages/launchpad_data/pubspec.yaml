publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  http: ^1.2.2
  launchpad_domain:
    path: ../launchpad_domain

dev_dependencies:
  launchpad_server:
    path: ../../services/launchpad_server
  lints: ^5.0.0
  shelf: ^1.4.3
  test: ^1.33.0
